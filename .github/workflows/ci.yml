name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate organization profile and community files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            profile/README.md
            profile/assets/navanem-header.svg
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            SECURITY.md
            SUPPORT.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug_report.yml
            .github/ISSUE_TEMPLATE/feature_request.yml
            .github/ISSUE_TEMPLATE/config.yml
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty: $path"; exit 1; }
          done
          grep -Fq 'https://www.navanem.com/' profile/README.md
          grep -Fq 'https://github.com/navanem' profile/README.md
